<style>
  :root {
    --border: #d0d5dd;
    --header-bg: #f4f6f8;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --danger: #dc2626;
    --text: #1f2937;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f9fafb;
    color: var(--text);
    margin: 0;
    padding: 24px 16px 60px;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  input[type="date"], select.date-select {
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
  }
  .spacer { flex: 1; }
  button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  button:hover { background: #f3f4f6; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.danger-outline {
    color: var(--danger);
    border-color: #f3c7c7;
  }
  button.danger-outline:hover { background: #fef2f2; }
  .table-scroll {
    overflow-x: auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 820px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0;
  }
  th {
    background: var(--header-bg);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 8px;
    text-align: left;
    white-space: nowrap;
  }
  td input {
    width: 100%;
    border: none;
    padding: 9px 8px;
    font-size: 14px;
    font-family: inherit;
    background: transparent;
  }
  td input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: #fff;
  }
  td.del-cell {
    text-align: center;
    width: 40px;
    padding: 0;
  }
  td.del-cell button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    padding: 6px;
    line-height: 1;
  }
  td.del-cell button:hover {
    color: var(--danger);
    background: #fef2f2;
  }
  .below-table {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
  }
  .actions-right {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    background: transparent;
    padding: 10px 4px;
    margin-right: 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }
  .tab-btn:hover { background: transparent; color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .empty-hint {
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Contractor Attendance Register</h1>
  <p class="subtitle">Records are saved automatically in this browser. Use Export to Excel to keep a permanent copy.</p>
  <p class="subtitle" id="syncStatus" style="margin-top:-14px;">Connecting to shared database…</p>

  <div class="tabs">
    <button type="button" id="tabDailyBtn" class="tab-btn active">Daily Entry</button>
    <button type="button" id="tabProjectBtn" class="tab-btn">View by Project</button>
  </div>

  <div id="dailyPanel">
    <div class="toolbar">
      <div class="field">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label for="savedDatesSelect">Jump to saved date</label>
        <select id="savedDatesSelect" class="date-select">
          <option value="">-- select --</option>
        </select>
      </div>
      <div class="spacer"></div>
      <button id="addRowBtn" class="primary">+ Add Row</button>
      <button id="exportBtn">Export to Excel</button>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:18%">Contractor Name</th>
            <th style="width:14%">Worker</th>
            <th style="width:22%">Project Name</th>
            <th style="width:14%">Working Hour</th>
            <th>Remark</th>
            <th class="del-cell"></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="below-table">
      <div class="status" id="statusText"></div>
      <div class="actions-right">
        <button id="deleteDayBtn" class="danger-outline">Delete This Day's Records</button>
      </div>
    </div>
  </div>

  <div id="projectPanel" style="display:none">
    <div class="toolbar">
      <div class="field">
        <label for="projectSelect">Project</label>
        <select id="projectSelect" class="date-select">
          <option value="">-- select project --</option>
        </select>
      </div>
      <div class="spacer"></div>
      <button id="exportProjectBtn">Export to Excel</button>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:12%">Date</th>
            <th style="width:16%">Contractor Name</th>
            <th style="width:14%">Worker</th>
            <th style="width:18%">Project Name</th>
            <th style="width:12%">Working Hour</th>
            <th>Remark</th>
          </tr>
        </thead>
        <tbody id="projectTableBody"></tbody>
      </table>
    </div>

    <div class="below-table">
      <div class="status" id="projectStatusText"></div>
      <div class="actions-right">
        <button id="deleteProjectBtn" class="danger-outline">Delete This Project's Records</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'contractorAttendanceData';
  // Cloud sync hook: a no-op until (and unless) the Firebase module below
  // successfully connects. The app must work fully offline either way.
  var cloudPushDate = function () {};
  var FIELDS = ['contractor', 'worker', 'project', 'hours', 'remark'];
  var FIELD_LABELS = {
    contractor: 'Contractor Name',
    worker: 'Worker',
    project: 'Project Name',
    hours: 'Working Hour',
    remark: 'Remark'
  };

  var dateInput = document.getElementById('dateInput');
  var savedDatesSelect = document.getElementById('savedDatesSelect');
  var tableBody = document.getElementById('tableBody');
  var addRowBtn = document.getElementById('addRowBtn');
  var exportBtn = document.getElementById('exportBtn');
  var deleteDayBtn = document.getElementById('deleteDayBtn');
  var statusText = document.getElementById('statusText');

  var tabDailyBtn = document.getElementById('tabDailyBtn');
  var tabProjectBtn = document.getElementById('tabProjectBtn');
  var dailyPanel = document.getElementById('dailyPanel');
  var projectPanel = document.getElementById('projectPanel');
  var projectSelect = document.getElementById('projectSelect');
  var projectTableBody = document.getElementById('projectTableBody');
  var exportProjectBtn = document.getElementById('exportProjectBtn');
  var projectStatusText = document.getElementById('projectStatusText');
  var deleteProjectBtn = document.getElementById('deleteProjectBtn');

  var currentDate = '';
  var currentRows = [];

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function loadAllData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveAllData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      return false;
    }
  }

  function blankRow() {
    return { contractor: '', worker: '', project: '', hours: '', remark: '' };
  }

  function blankRows(n) {
    var rows = [];
    for (var i = 0; i < n; i++) rows.push(blankRow());
    return rows;
  }

  function rowsHaveContent(rows) {
    return rows.some(function (r) {
      return FIELDS.some(function (f) { return r[f] && r[f].trim() !== ''; });
    });
  }

  function persistCurrentDay() {
    var data = loadAllData();
    var hasContent = rowsHaveContent(currentRows);
    if (hasContent) {
      data[currentDate] = currentRows;
    } else {
      delete data[currentDate];
    }
    var ok = saveAllData(data);
    statusText.textContent = ok
      ? 'Saved to this browser at ' + new Date().toLocaleTimeString()
      : 'Could not save (browser storage unavailable)';
    populateSavedDates();
    cloudPushDate(currentDate, currentRows);
  }

  function populateSavedDates() {
    var data = loadAllData();
    var dates = Object.keys(data).sort().reverse();
    var selected = savedDatesSelect.value;
    savedDatesSelect.innerHTML = '<option value="">-- select --</option>';
    dates.forEach(function (d) {
      var opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d + ' (' + data[d].length + ' rows)';
      savedDatesSelect.appendChild(opt);
    });
    savedDatesSelect.value = dates.indexOf(selected) !== -1 ? selected : '';
  }

  function renderTable() {
    tableBody.innerHTML = '';
    currentRows.forEach(function (row, index) {
      var tr = document.createElement('tr');
      FIELDS.forEach(function (field) {
        var td = document.createElement('td');
        var input = document.createElement('input');
        input.type = 'text';
        input.value = row[field];
        input.setAttribute('data-index', index);
        input.setAttribute('data-field', field);
        input.setAttribute('aria-label', FIELD_LABELS[field]);
        td.appendChild(input);
        tr.appendChild(td);
      });
      var delTd = document.createElement('td');
      delTd.className = 'del-cell';
      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.title = 'Delete row';
      delBtn.setAttribute('data-index', index);
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);
      tableBody.appendChild(tr);
    });
  }

  function loadDate(dateStr) {
    currentDate = dateStr;
    dateInput.value = dateStr;
    var data = loadAllData();
    currentRows = data[dateStr] ? JSON.parse(JSON.stringify(data[dateStr])) : blankRows(3);
    renderTable();
    statusText.textContent = data[dateStr] ? 'Loaded saved records for ' + dateStr : 'No saved records yet for ' + dateStr;
  }

  tableBody.addEventListener('input', function (e) {
    var target = e.target;
    if (target.tagName !== 'INPUT') return;
    var index = parseInt(target.getAttribute('data-index'), 10);
    var field = target.getAttribute('data-field');
    currentRows[index][field] = target.value;
    persistCurrentDay();
  });

  tableBody.addEventListener('click', function (e) {
    var target = e.target;
    if (target.tagName !== 'BUTTON') return;
    var index = parseInt(target.getAttribute('data-index'), 10);
    var row = currentRows[index];
    var hasContent = FIELDS.some(function (f) { return row[f] && row[f].trim() !== ''; });
    if (hasContent && !confirm('Delete this row?')) return;
    currentRows.splice(index, 1);
    if (currentRows.length === 0) currentRows.push(blankRow());
    renderTable();
    persistCurrentDay();
  });

  addRowBtn.addEventListener('click', function () {
    currentRows.push(blankRow());
    renderTable();
    persistCurrentDay();
  });

  dateInput.addEventListener('change', function () {
    if (!dateInput.value) return;
    loadDate(dateInput.value);
  });

  savedDatesSelect.addEventListener('change', function () {
    if (savedDatesSelect.value) loadDate(savedDatesSelect.value);
  });

  deleteDayBtn.addEventListener('click', function () {
    if (!confirm('Delete all records for ' + currentDate + '? This cannot be undone.')) return;
    var data = loadAllData();
    delete data[currentDate];
    saveAllData(data);
    var deletedDate = currentDate;
    currentRows = blankRows(3);
    renderTable();
    statusText.textContent = 'Deleted records for ' + deletedDate;
    populateSavedDates();
    cloudPushDate(deletedDate, []);
  });

  // ---- Styled .xlsx writer (no external library; builds a real OOXML file) ----

  function xmlEscape(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function colLetter(n) {
    var s = '';
    while (n > 0) {
      var rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  var CRC_TABLE = (function () {
    var table = [];
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    var crc = 0 ^ (-1);
    for (var i = 0; i < bytes.length; i++) {
      crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ (-1)) >>> 0;
  }

  function buildZip(files) {
    var encoder = new TextEncoder();
    var localParts = [];
    var centralParts = [];
    var offset = 0;

    files.forEach(function (file) {
      var nameBytes = encoder.encode(file.name);
      var data = file.data;
      var crc = crc32(data);

      var localHeader = new Uint8Array(30 + nameBytes.length);
      var view = new DataView(localHeader.buffer);
      view.setUint32(0, 0x04034b50, true);
      view.setUint16(4, 20, true);
      view.setUint16(6, 0, true);
      view.setUint16(8, 0, true);
      view.setUint16(10, 0, true);
      view.setUint16(12, 0, true);
      view.setUint32(14, crc, true);
      view.setUint32(18, data.length, true);
      view.setUint32(22, data.length, true);
      view.setUint16(26, nameBytes.length, true);
      view.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);
      localParts.push(localHeader, data);

      var centralHeader = new Uint8Array(46 + nameBytes.length);
      var cview = new DataView(centralHeader.buffer);
      cview.setUint32(0, 0x02014b50, true);
      cview.setUint16(4, 20, true);
      cview.setUint16(6, 20, true);
      cview.setUint16(8, 0, true);
      cview.setUint16(10, 0, true);
      cview.setUint16(12, 0, true);
      cview.setUint16(14, 0, true);
      cview.setUint32(16, crc, true);
      cview.setUint32(20, data.length, true);
      cview.setUint32(24, data.length, true);
      cview.setUint16(28, nameBytes.length, true);
      cview.setUint16(30, 0, true);
      cview.setUint16(32, 0, true);
      cview.setUint16(34, 0, true);
      cview.setUint16(36, 0, true);
      cview.setUint32(38, 0, true);
      cview.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);
      centralParts.push(centralHeader);

      offset += localHeader.length + data.length;
    });

    var centralStart = offset;
    var centralSize = centralParts.reduce(function (sum, p) { return sum + p.length; }, 0);

    var eocd = new Uint8Array(22);
    var eview = new DataView(eocd.buffer);
    eview.setUint32(0, 0x06054b50, true);
    eview.setUint16(8, files.length, true);
    eview.setUint16(10, files.length, true);
    eview.setUint32(12, centralSize, true);
    eview.setUint32(16, centralStart, true);

    var allParts = localParts.concat(centralParts, [eocd]);
    var totalLen = allParts.reduce(function (sum, p) { return sum + p.length; }, 0);
    var result = new Uint8Array(totalLen);
    var pos = 0;
    allParts.forEach(function (p) { result.set(p, pos); pos += p.length; });
    return result;
  }

  // Builds a styled .xlsx: a merged title row (bottom border only), a bordered
  // + centered header row, and bordered + centered data rows — matching the
  // house format (title line above a bordered, centered table).
  function downloadStyledXlsx(title, headerRow, dataRows, filename) {
    var numCols = headerRow.length;
    var lastColLetter = colLetter(numCols);
    var totalRows = 2 + dataRows.length;

    var colWidths = headerRow.map(function (h, i) {
      var maxLen = String(h).length;
      dataRows.forEach(function (row) {
        var v = row[i] == null ? '' : String(row[i]);
        if (v.length > maxLen) maxLen = v.length;
      });
      return Math.min(Math.max(maxLen + 4, 12), 40);
    });

    var colsXml = '<cols>' + colWidths.map(function (w, i) {
      return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    }).join('') + '</cols>';

    var rowsXml = '';

    rowsXml += '<row r="1" ht="22" customHeight="1">';
    for (var c = 1; c <= numCols; c++) {
      var ref = colLetter(c) + '1';
      if (c === 1) {
        rowsXml += '<c r="' + ref + '" s="1" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(title) + '</t></is></c>';
      } else {
        rowsXml += '<c r="' + ref + '" s="1"/>';
      }
    }
    rowsXml += '</row>';

    rowsXml += '<row r="2" ht="20" customHeight="1">';
    headerRow.forEach(function (h, i) {
      var hRef = colLetter(i + 1) + '2';
      rowsXml += '<c r="' + hRef + '" s="2" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(h) + '</t></is></c>';
    });
    rowsXml += '</row>';

    dataRows.forEach(function (row, ri) {
      var rowNum = ri + 3;
      rowsXml += '<row r="' + rowNum + '" ht="20" customHeight="1">';
      for (var ci = 0; ci < numCols; ci++) {
        var dRef = colLetter(ci + 1) + rowNum;
        var val = row[ci] == null ? '' : String(row[ci]);
        rowsXml += '<c r="' + dRef + '" s="2" t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(val) + '</t></is></c>';
      }
      rowsXml += '</row>';
    });

    var sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<dimension ref="A1:' + lastColLetter + totalRows + '"/>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      colsXml +
      '<sheetData>' + rowsXml + '</sheetData>' +
      '<mergeCells count="1"><mergeCell ref="A1:' + lastColLetter + '1"/></mergeCells>' +
      '</worksheet>';

    var stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="1"><font><sz val="12"/><name val="Calibri"/></font></fonts>' +
      '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
      '<borders count="3">' +
        '<border><left/><right/><top/><bottom/><diagonal/></border>' +
        '<border><left/><right/><top/><bottom style="thin"><color indexed="64"/></bottom><diagonal/></border>' +
        '<border><left style="thin"><color indexed="64"/></left><right style="thin"><color indexed="64"/></right><top style="thin"><color indexed="64"/></top><bottom style="thin"><color indexed="64"/></bottom><diagonal/></border>' +
      '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="3">' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="2" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
      '</styleSheet>';

    var workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="Attendance" sheetId="1" r:id="rId1"/></sheets>' +
      '</workbook>';

    var workbookRelsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';

    var rootRelsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';

    var contentTypesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';

    var encoder = new TextEncoder();
    var files = [
      { name: '[Content_Types].xml', data: encoder.encode(contentTypesXml) },
      { name: '_rels/.rels', data: encoder.encode(rootRelsXml) },
      { name: 'xl/workbook.xml', data: encoder.encode(workbookXml) },
      { name: 'xl/_rels/workbook.xml.rels', data: encoder.encode(workbookRelsXml) },
      { name: 'xl/styles.xml', data: encoder.encode(stylesXml) },
      { name: 'xl/worksheets/sheet1.xml', data: encoder.encode(sheetXml) }
    ];

    var zipBytes = buildZip(files);
    var blob = new Blob([zipBytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  exportBtn.addEventListener('click', function () {
    var header = ['Contractor Name', 'Worker', 'Project Name', 'Working Hour', 'Remark'];
    var dataRows = [];
    currentRows.forEach(function (row) {
      var hasContent = FIELDS.some(function (f) { return row[f] && row[f].trim() !== ''; });
      if (!hasContent) return;
      dataRows.push([row.contractor, row.worker, row.project, row.hours, row.remark]);
    });
    if (dataRows.length === 0) {
      alert('No data to export for this date.');
      return;
    }
    downloadStyledXlsx('Date: ' + currentDate, header, dataRows, 'contractor_attendance_' + currentDate + '.xlsx');
  });

  // ---- View by Project ----

  function getDistinctProjects() {
    var data = loadAllData();
    var set = {};
    Object.keys(data).forEach(function (date) {
      data[date].forEach(function (row) {
        var p = (row.project || '').trim();
        if (p) set[p] = true;
      });
    });
    return Object.keys(set).sort(function (a, b) {
      return a.localeCompare(b, undefined, { sensitivity: 'base' });
    });
  }

  function populateProjectSelect() {
    var projects = getDistinctProjects();
    var selected = projectSelect.value;
    projectSelect.innerHTML = '<option value="">-- select project --</option>';
    projects.forEach(function (p) {
      var opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      projectSelect.appendChild(opt);
    });
    projectSelect.value = projects.indexOf(selected) !== -1 ? selected : '';
  }

  function getProjectRows(projectName) {
    var data = loadAllData();
    var dates = Object.keys(data).sort();
    var rows = [];
    dates.forEach(function (date) {
      data[date].forEach(function (row) {
        if ((row.project || '').trim() === projectName) {
          rows.push({ date: date, row: row });
        }
      });
    });
    return rows;
  }

  function renderProjectTable() {
    var projectName = projectSelect.value;
    projectTableBody.innerHTML = '';
    if (!projectName) {
      projectTableBody.innerHTML = '<tr><td colspan="6" class="empty-hint">Select a project above to view its attendance across all dates.</td></tr>';
      projectStatusText.textContent = '';
      return;
    }
    var entries = getProjectRows(projectName);
    if (entries.length === 0) {
      projectTableBody.innerHTML = '<tr><td colspan="6" class="empty-hint">No records found for this project.</td></tr>';
      projectStatusText.textContent = '';
      return;
    }
    entries.forEach(function (entry) {
      var tr = document.createElement('tr');
      var cells = [entry.date, entry.row.contractor, entry.row.worker, entry.row.project, entry.row.hours, entry.row.remark];
      cells.forEach(function (val) {
        var td = document.createElement('td');
        td.style.padding = '9px 8px';
        td.style.fontSize = '14px';
        td.textContent = val || '';
        tr.appendChild(td);
      });
      projectTableBody.appendChild(tr);
    });
    projectStatusText.textContent = entries.length + ' record(s) for "' + projectName + '"';
  }

  projectSelect.addEventListener('change', renderProjectTable);

  deleteProjectBtn.addEventListener('click', function () {
    var projectName = projectSelect.value;
    if (!projectName) {
      alert('Please select a project first.');
      return;
    }
    var typed = prompt(
      'This will permanently delete every attendance record for "' + projectName + '" across all dates.\n\n' +
      'Type DELETE (in capital letters) to confirm:'
    );
    if (typed === null) return;
    if (typed !== 'DELETE') {
      alert('Deletion cancelled — you must type DELETE exactly to confirm.');
      return;
    }
    var data = loadAllData();
    var affectedDates = [];
    Object.keys(data).forEach(function (date) {
      var before = data[date].length;
      data[date] = data[date].filter(function (row) { return (row.project || '').trim() !== projectName; });
      if (data[date].length !== before) affectedDates.push(date);
      if (data[date].length === 0) delete data[date];
    });
    saveAllData(data);
    affectedDates.forEach(function (date) {
      cloudPushDate(date, data[date] || []);
    });
    populateProjectSelect();
    renderProjectTable();
    populateSavedDates();
    if (currentDate) loadDate(currentDate);
    projectStatusText.textContent = 'Deleted all records for "' + projectName + '".';
  });

  exportProjectBtn.addEventListener('click', function () {
    var projectName = projectSelect.value;
    if (!projectName) {
      alert('Please select a project first.');
      return;
    }
    var entries = getProjectRows(projectName);
    if (entries.length === 0) {
      alert('No data to export for this project.');
      return;
    }
    var header = ['Date', 'Contractor Name', 'Worker', 'Working Hour', 'Remark'];
    var dataRows = entries.map(function (entry) {
      return [entry.date, entry.row.contractor, entry.row.worker, entry.row.hours, entry.row.remark];
    });
    var safeName = projectName.replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '') || 'project';
    downloadStyledXlsx('Project Name: ' + projectName, header, dataRows, 'contractor_attendance_' + safeName + '_all_dates.xlsx');
  });

  function showTab(tab) {
    if (tab === 'project') {
      tabDailyBtn.classList.remove('active');
      tabProjectBtn.classList.add('active');
      dailyPanel.style.display = 'none';
      projectPanel.style.display = 'block';
      populateProjectSelect();
      renderProjectTable();
    } else {
      tabProjectBtn.classList.remove('active');
      tabDailyBtn.classList.add('active');
      projectPanel.style.display = 'none';
      dailyPanel.style.display = 'block';
    }
  }

  tabDailyBtn.addEventListener('click', function () { showTab('daily'); });
  tabProjectBtn.addEventListener('click', function () { showTab('project'); });

  // Refreshes whatever is currently on screen after data changed underneath it
  // (e.g. a remote sync merged in records from another device).
  function refreshFromRemote() {
    populateSavedDates();
    var data = loadAllData();
    currentRows = data[currentDate] ? JSON.parse(JSON.stringify(data[currentDate])) : blankRows(3);
    renderTable();
    if (projectPanel.style.display !== 'none') {
      populateProjectSelect();
      renderProjectTable();
    }
  }

  // Small public API so the separate (optional) Firebase sync module can plug
  // in without this file ever depending on it — the app above is fully
  // functional on its own using only browser storage.
  window.attendanceApp = {
    getLocalData: loadAllData,
    setLocalData: saveAllData,
    refreshFromRemote: refreshFromRemote,
    setCloudPush: function (fn) { cloudPushDate = fn; }
  };

  // init
  populateSavedDates();
  loadDate(todayStr());
})();
</script>

<script type="module">
  // ---- Optional cloud sync (Firebase Firestore) ----
  // This runs as a separate, isolated module so that if it fails for any
  // reason (no internet, the CDN is blocked, the Firestore database isn't
  // set up yet, etc.) the app above keeps working normally on local browser
  // storage alone. Data is only ever synced in addition to — never instead
  // of — the local save.
  (async function () {
    var syncStatusEl = document.getElementById('syncStatus');
    var app = window.attendanceApp;
    if (!app) return;

    try {
      var appModule = await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js');
      var fsModule = await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js');
      var initializeApp = appModule.initializeApp;
      var getFirestore = fsModule.getFirestore;
      var doc = fsModule.doc;
      var setDoc = fsModule.setDoc;
      var deleteDoc = fsModule.deleteDoc;
      var collection = fsModule.collection;
      var onSnapshot = fsModule.onSnapshot;

      var firebaseConfig = {
        apiKey: "AIzaSyDFrm_5bON6BqIOs0Cc3vorE34lPDuBURc",
        authDomain: "contractor-attendance.firebaseapp.com",
        projectId: "contractor-attendance",
        storageBucket: "contractor-attendance.firebasestorage.app",
        messagingSenderId: "1051273531407",
        appId: "1:1051273531407:web:c558b93541e469b735d37a",
        measurementId: "G-HVKDR6K7BW"
      };

      var firebaseApp = initializeApp(firebaseConfig);
      var db = getFirestore(firebaseApp);
      var attendanceCollection = collection(db, 'attendance');
      var firstSnapshotReceived = false;

      app.setCloudPush(function (dateStr, rows) {
        var ref = doc(attendanceCollection, dateStr);
        var hasContent = rows.some(function (r) {
          return r && (r.contractor || r.worker || r.project || r.hours || r.remark);
        });
        var task = hasContent ? setDoc(ref, { rows: rows }) : deleteDoc(ref);
        task.catch(function (err) {
          console.warn('Firestore sync failed for ' + dateStr, err);
          syncStatusEl.textContent = 'Working offline — changes are saved on this device, but not synced yet.';
        });
      });

      onSnapshot(attendanceCollection, function (snapshot) {
        var data = app.getLocalData();
        snapshot.docChanges().forEach(function (change) {
          if (change.type === 'removed') {
            delete data[change.doc.id];
            return;
          }
          var rows = (change.doc.data() && change.doc.data().rows) || [];
          if (rows.length > 0) {
            data[change.doc.id] = rows;
          } else {
            delete data[change.doc.id];
          }
        });
        app.setLocalData(data);
        app.refreshFromRemote();
        firstSnapshotReceived = true;
        syncStatusEl.textContent = 'Connected — records are syncing across every device using this file.';
      }, function (err) {
        console.warn('Firestore listener error', err);
        syncStatusEl.textContent = firstSnapshotReceived
          ? 'Working offline — changes are saved on this device, but not synced right now.'
          : 'Could not connect to the shared database — using records saved on this device only.';
      });
    } catch (err) {
      console.warn('Firebase sync unavailable, continuing in local-only mode', err);
      if (syncStatusEl) {
        syncStatusEl.textContent = 'Working offline — this device only (could not reach the shared database).';
      }
    }
  })();
</script>
